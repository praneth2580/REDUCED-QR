<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RQR — Reducted QR logo</title>
  <desc id="desc">
    A stylized multi-colored QR-inspired grid with rounded finder corners and the text RQR
  </desc>
<!--defs: shadow + font fallback-->
  <defs>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-opacity="0.12" flood-color="#000"/>
    </filter>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
<!--Rounded corner shape for finder marks-->
    <symbol id="finderCorner" viewBox="0 0 100 100">
<!--outer L-->
      <path d="M0 24 A12 12 0 0 1 12 12 L12 40 L40 40 L40 52 L12 52 L12 88 A12 12 0 0 1 0 76 Z" fill="#222"/>
    </symbol>
    <style>
      <![CDATA[
        @font-face {
          font-family: 'InterVarFallback';
          src: local('Inter'), local('Helvetica'), local('Arial');
        }
      ]]>
    </style>
  </defs>
<!--background-->
  <rect width="100%" height="100%" rx="28" fill="#0f1724"/>
<!--card area for the QR element-->
  <g transform="translate(56,64)">
<!--soft card-->
    <rect width="292" height="292" rx="28" fill="#0f1724" opacity="0.06" filter="url(#softShadow)"/>
    <rect x="8" y="8" width="276" height="276" rx="22" fill="#0b1220"/>
<!--glass sheen-->
    <rect x="12" y="12" width="260" height="260" rx="20" fill="url(#glass)"/>
<!--finder corners-->
<!--top-left-->
    <use href="#finderCorner" x="22" y="22" width="72" height="72"/>
<!--top-right (mirror horizontally)-->
    <g transform="translate(422,22) scale(-1,1)">
      <use href="#finderCorner" x="0" y="0" width="72" height="72"/>
    </g>
<!--bottom-left (mirror vertically)-->
    <g transform="translate(22,242) scale(1,-1)">
      <use href="#finderCorner" x="0" y="-72" width="72" height="72"/>
    </g>
<!--small 3x3 reduced colored grid centered-->
<!--grid parameters-->
<!--cell size 60, gap 10 -> total 3*60 + 2*10 = 200-->
    <g transform="translate(40,38)">
<!--background rounded panel for contrast-->
      <rect x="-8" y="-8" width="216" height="216" rx="24" fill="#0b1220" opacity="0.22"/>
<!--cells-->
<!--row1-->
      <rect x="0" y="0" width="60" height="60" rx="8" fill="#ff4d4f"/>
      <rect x="70" y="0" width="60" height="60" rx="8" fill="#ff9500"/>
      <rect x="140" y="0" width="60" height="60" rx="8" fill="#ffd500"/>
<!--row2-->
      <rect x="0" y="70" width="60" height="60" rx="8" fill="#28c76f"/>
      <rect x="70" y="70" width="60" height="60" rx="8" fill="#00b7ff"/>
      <rect x="140" y="70" width="60" height="60" rx="8" fill="#6b5cff"/>
<!--row3-->
      <rect x="0" y="140" width="60" height="60" rx="8" fill="#9b59b6"/>
      <rect x="70" y="140" width="60" height="60" rx="8" fill="#ff6bcb"/>
      <rect x="140" y="140" width="60" height="60" rx="8" fill="#66d9a3"/>
<!--subtle inner square to suggest QR modules-->
      <g opacity="0.12">
        <rect x="6" y="6" width="48" height="48" rx="6" fill="#000"/>
        <rect x="76" y="6" width="48" height="48" rx="6" fill="#000"/>
        <rect x="146" y="6" width="48" height="48" rx="6" fill="#000"/>
        <rect x="6" y="76" width="48" height="48" rx="6" fill="#000"/>
        <rect x="76" y="76" width="48" height="48" rx="6" fill="#000"/>
        <rect x="146" y="76" width="48" height="48" rx="6" fill="#000"/>
        <rect x="6" y="146" width="48" height="48" rx="6" fill="#000"/>
        <rect x="76" y="146" width="48" height="48" rx="6" fill="#000"/>
        <rect x="146" y="146" width="48" height="48" rx="6" fill="#000"/>
      </g>
<!--faint glow around colored grid-->
      <g>
        <circle cx="100" cy="100" r="110" fill="#ffffff" opacity="0.02"/>
      </g>
    </g>
  </g>
<!--RQR text to the right-->
  <g transform="translate(380,60)">
<!--text background block for alignment-->
    <rect x="0" y="0" width="520" height="292" rx="28" fill="none"/>
    <text x="28" y="182" font-family="InterVarFallback, Arial, Helvetica, sans-serif" font-weight="700" font-size="160" letter-spacing="6" fill="#e6eef8">
      RQR
    </text>
<!--tagline smaller-->
    <text x="30" y="230" font-family="InterVarFallback, Arial, Helvetica, sans-serif" font-weight="500" font-size="28" fill="#9fb3cc">
      Reducted QR — compact • colorful • shareable
    </text>
  </g>
</svg>
